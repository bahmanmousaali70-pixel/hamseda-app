name: Dependency security audit

on:
  push:
    branches: ['chore/**']
    paths:
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve npm dependency graph without running package scripts
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Generate complete npm audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-report.json
          AUDIT_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const vulns = report.vulnerabilities || {};
          const counts = report.metadata?.vulnerabilities || {};
          const lines = [
            '## Dependency audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical','high','moderate','low','info'].map(k => `| ${k} | ${counts[k] ?? 0} |`),
            '',
            '| Package | Severity | Direct | Installed range | Fix available |',
            '|---|---|---:|---|---|',
            ...Object.entries(vulns).map(([name,v]) => `| ${name} | ${v.severity} | ${v.isDirect ? 'yes' : 'no'} | ${v.range || '—'} | ${typeof v.fixAvailable === 'object' ? JSON.stringify(v.fixAvailable) : String(v.fixAvailable)} |`),
            '',
            'Full advisory details are in the npm-audit-report artifact.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(JSON.stringify({counts, vulnerabilities: Object.fromEntries(Object.entries(vulns).map(([name,v]) => [name,{severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via}]))}, null, 2));
          NODE
          echo "npm audit exit code: $AUDIT_EXIT"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: hamseda-npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: error
          retention-days: 14
