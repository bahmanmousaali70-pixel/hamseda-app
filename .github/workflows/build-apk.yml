name: Build Android APK

concurrency:
  group: hamseda-android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, 'release/**', 'feature/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and install Android 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android/debug-signing-key.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Provision offline Persian neural TTS assets
        run: |
          mkdir -p android/app/libs android/app/src/main/assets/offline_tts/gyro
          curl --http1.1 --location --fail --continue-at - --retry 12 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.10.41.aar" -o android/app/libs/sherpa-onnx.aar
          curl --http1.1 --location --fail --continue-at - --retry 12 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fa_IR-gyro-medium.tar.bz2" -o /tmp/gyro.tar.bz2
          mkdir -p /tmp/gyro && tar -xjf /tmp/gyro.tar.bz2 -C /tmp/gyro
          MODEL="$(find /tmp/gyro -name 'fa_IR-gyro-medium.onnx' -type f | head -n 1)"
          TOKENS="$(find /tmp/gyro -name 'tokens.txt' -type f | head -n 1)"
          test -n "$MODEL" && test -n "$TOKENS"
          cp "$MODEL" android/app/src/main/assets/offline_tts/gyro/model.onnx
          cp "$TOKENS" android/app/src/main/assets/offline_tts/gyro/tokens.txt
          curl --http1.1 --location --fail --continue-at - --retry 12 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2" -o /tmp/espeak-ng-data.tar.bz2
          tar -xjf /tmp/espeak-ng-data.tar.bz2 -C android/app/src/main/assets/offline_tts/
          test -s android/app/src/main/assets/offline_tts/gyro/model.onnx
          test -s android/app/src/main/assets/offline_tts/gyro/tokens.txt
          test -d android/app/src/main/assets/offline_tts/espeak-ng-data

      - name: Bundle offline Persian wake-word recognition model
        run: |
          mkdir -p android/app/src/main/assets/wake
          MODEL_NAME="vosk-model-small-fa-0.42"
          curl --http1.1 --location --fail --continue-at - --retry 12 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 "https://alphacephei.com/vosk/models/${MODEL_NAME}.zip" -o "/tmp/${MODEL_NAME}.zip"
          unzip -t "/tmp/${MODEL_NAME}.zip"
          unzip -Z1 "/tmp/${MODEL_NAME}.zip" > /tmp/vosk-model-files.txt
          grep -q "^${MODEL_NAME}/am/" /tmp/vosk-model-files.txt
          grep -q "^${MODEL_NAME}/conf/" /tmp/vosk-model-files.txt
          test -s "/tmp/${MODEL_NAME}.zip"
          cp "/tmp/${MODEL_NAME}.zip" "android/app/src/main/assets/wake/${MODEL_NAME}.zip"
          ls -lh "android/app/src/main/assets/wake/${MODEL_NAME}.zip"

      - name: Install dependencies and build web bundle
        run: |
          bun install --frozen-lockfile
          npm run lint
          VITE_APP_VERSION="$APP_VERSION" npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Retrying in $((attempt * 30)) seconds..."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Verify APK signatures and package metadata
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          "$AAPT2" dump badging "$APK" | head -n 25
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Rename APK for easy installation
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hamseda.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamseda-apk
          path: hamseda.apk

      - name: Publish Development APK to GitHub Pre-release
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-v${{ env.APP_VERSION }}
          name: هم‌صدا - نسخه آزمایشی ${{ env.APP_VERSION }}
          body: نسخه آزمایشی شاخه توسعه هم‌صدا (${{ github.ref_name }}). فایل حاصله را مستقیم بدون نیاز به استخراج ZIP نصب کنید.
          prerelease: true
          make_latest: false
          files: hamseda.apk
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish Latest APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: هم‌صدا - آخرین نسخه APK
          body: فایل نصبی اپلیکیشن هم‌صدا
          files: hamseda.apk
          overwrite_files: true
