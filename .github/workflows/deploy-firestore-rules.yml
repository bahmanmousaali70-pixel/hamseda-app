name: Deploy Firestore security rules

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy firestore.rules to the configured Hamseda database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-rules:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Google service account credential
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "::error::Add the GOOGLE_CREDENTIALS repository secret containing the service account JSON."
            exit 1
          fi

      - name: Authenticate to Google Cloud with service account
        uses: google-github-actions/auth@v3
        with:
          project_id: modified-transport-wv0ns
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy Firestore rules to the configured named database
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project modified-transport-wv0ns --non-interactive
