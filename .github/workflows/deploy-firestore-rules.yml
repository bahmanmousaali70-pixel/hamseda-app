name: Deploy Firestore security rules

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy firestore.rules to the configured Hamseda database
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy Firestore rules to the configured named database
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project modified-transport-wv0ns --non-interactive
